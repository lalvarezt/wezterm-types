name: Plugin Maintenance

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/plugin-maintenance.yml"
      - "CONTRIBUTING.md"
      - "Makefile"
      - "README.md"
      - "metadata/plugins.json"
      - "scripts/plugin-maintenance.sh"
      - "scripts/templates/plugin-maintenance-*.tmpl"
  push:
    branches:
      - main
      - plugin-version-tracking
    paths:
      - ".github/workflows/plugin-maintenance.yml"
      - "CONTRIBUTING.md"
      - "Makefile"
      - "README.md"
      - "metadata/plugins.json"
      - "scripts/plugin-maintenance.sh"
      - "scripts/templates/plugin-maintenance-*.tmpl"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate manifest and README
        run: |
          ./scripts/plugin-maintenance.sh validate

  publish:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      PLUGIN_MAINTENANCE_BUILD_DIR: .tmp/plugin-maintenance
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Build maintenance report
        run: |
          ./scripts/plugin-maintenance.sh sync
          ./scripts/plugin-maintenance.sh render-pages

      - name: Compute publish signature
        run: |
          set -euo pipefail
          report_hash=$(jq -c 'del(.checked_at)' "${PLUGIN_MAINTENANCE_BUILD_DIR}/report.json" | sha256sum | cut -d' ' -f1)
          script_hash=$(sha256sum scripts/plugin-maintenance.sh | cut -d' ' -f1)
          page_template_hash=$(sha256sum scripts/templates/plugin-maintenance-page.html.tmpl | cut -d' ' -f1)
          redirect_template_hash=$(sha256sum scripts/templates/plugin-maintenance-redirect.html.tmpl | cut -d' ' -f1)
          jq -nc \
            --arg report_hash "$report_hash" \
            --arg script_hash "$script_hash" \
            --arg page_template_hash "$page_template_hash" \
            --arg redirect_template_hash "$redirect_template_hash" \
            '{
              report_hash: $report_hash,
              script_hash: $script_hash,
              page_template_hash: $page_template_hash,
              redirect_template_hash: $redirect_template_hash
            }' \
            > "${PLUGIN_MAINTENANCE_BUILD_DIR}/pages/plugin-maintenance/content-signature.json"

      - name: Check for publish changes
        id: publish_check
        env:
          SIGNATURE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/plugin-maintenance/content-signature.json
        run: |
          set -euo pipefail
          local_signature="${PLUGIN_MAINTENANCE_BUILD_DIR}/pages/plugin-maintenance/content-signature.json"
          remote_signature=$(mktemp)
          should_publish=true

          if curl --fail --silent --show-error --location "$SIGNATURE_URL" -o "$remote_signature"; then
            if cmp -s "$local_signature" "$remote_signature"; then
              should_publish=false
            fi
          fi

          echo "should_publish=${should_publish}" >> "$GITHUB_OUTPUT"

          if [[ "$should_publish" == "false" ]]; then
            {
              echo ""
              echo "No GitHub Pages deploy was needed."
              echo ""
              echo "The generated maintenance site matched the currently published content."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Write workflow summary
        run: |
          jq -r '
            "## Plugin Maintenance",
            "",
            "| Metric | Value |",
            "|--------|-------|",
            "| Total | \(.summary.total) |",
            "| Up to date | \(.summary.up_to_date) |",
            "| Outdated | \(.summary.outdated) |",
            "| Errors | \(.summary.error) |",
            "",
            "| Plugin | Tracked | Upstream | Status |",
            "|--------|---------|----------|--------|",
            (
              .plugins[]
              | "| \(.readme_name) | "
                + (if .tracked_ref.kind == "commit" then "\(.tracked_ref.kind):\(.tracked_ref.value[0:7])" else "\(.tracked_ref.kind):\(.tracked_ref.value)" end)
                + " | "
                + (
                    if .upstream_ref then
                      if .upstream_ref.kind == "commit" then "\(.upstream_ref.kind):\(.upstream_ref.value[0:7])" else "\(.upstream_ref.kind):\(.upstream_ref.value)" end
                    else
                      "-"
                    end
                  )
                + " | \(.status) |"
            )
          ' "${PLUGIN_MAINTENANCE_BUILD_DIR}/report.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Pages artifact
        if: steps.publish_check.outputs.should_publish == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: .tmp/plugin-maintenance/pages

      - name: Deploy to GitHub Pages
        if: steps.publish_check.outputs.should_publish == 'true'
        id: deployment
        uses: actions/deploy-pages@v5
